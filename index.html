<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automated Content Ingestion Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      color: #202124;
      line-height: 1.5;
    }
    .card {
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 24px;
      background: #f8f9fa;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-family: monospace;
      box-sizing: border-box;
    }
    button[type="submit"] {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1a73e8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button[type="submit"]:hover {
      background-color: #1557b0;
    }
    #status {
      display: none;
      padding: 12px;
      background-color: #e6f4ea;
      color: #137333;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>

      ></textarea>
      <button type="submit" id="submit-btn">Create Draft Content</button>
    </form>
    <div id="status">Draft content successfully created and queued for review.</div>
  </div>
