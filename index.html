<!DOCTYPE html>
<html>
<head>
  <title>Universal Text Formatter</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 30px; background-color: #f9f9f9; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    h1 { font-size: 20px; border-bottom: 1px solid #eaecef; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    textarea { width: 100%; height: 150px; border: 1px solid #d1d5da; border-radius: 4px; padding: 8px; font-family: monospace; box-sizing: border-box; }
    button { background-color: #0366d6; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #0256b9; }

  </style>
</head>
<body>

<div class="container">
  <h1>Universal Text Formatter</h1>
  <p>Paste your text below to format and clean it up.</p>
  
  <div class="form-group">
    <label for="text-input">Source Text:</label>
    <textarea id="text-input" placeholder="Paste text here..."></textarea>
  </div>
  
  <button onclick="formatText()">Format Text</button>
  
  <div class="form-group" style="margin-top: 20px;">
